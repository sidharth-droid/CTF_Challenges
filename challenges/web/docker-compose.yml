    ports:
      - "8001:5000"
    restart: unless-stopped

  flagcombined:
    build:
      context: ./easy/flagcombined
      dockerfile: Dockerfile
    ports:
      - "8002:80"
    restart: unless-stopped

  treasure_hunt:
