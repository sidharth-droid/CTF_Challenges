<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Vault - Access Denied</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <span>NeonVault v2.3.1 - Secure Access Terminal</span>
            <div class="terminal-buttons">
                <span class="btn red"></span>
                <span class="btn yellow"></span>
                <span class="btn green"></span>
            </div>
        </div>
        <div class="terminal-body">
            <div class="terminal-text">
                <p class="prompt">root@neonvault:~$ access_vault --key</p>
                <p class="output error">[ERROR] Access Denied: Invalid credentials.</p>
                <p class="output">[SYSTEM] The key might already be in your possession...</p>
                <p class="prompt">root@neonvault:~$ _</p>
            </div>
        </div>
    </div>
</body>
</html>
